<section class="session-container">
  <h1>BodeGo</h1>
  <p>Iniciar sesión</p>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <form #loginForm="ngForm" (ngSubmit)="start()" [attr.aria-busy]="loading()">
    <label for="email">Correo electrónico</label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="username"
      [(ngModel)]="email"
      required
      email
      maxlength="254"
      [disabled]="loading()"
    />
    <label for="password">Contraseña</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      [(ngModel)]="password"
      required
      maxlength="72"
      [disabled]="loading()"
    />
    <button type="submit" [disabled]="loading() || loginForm.invalid">
      {{ loading() ? 'Ingresando…' : 'Entrar a BodeGo' }}
    </button>
  </form>
</section>
